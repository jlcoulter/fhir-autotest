[package]
name = "fhir-autotest"
version = "0.1.0"
edition = "2024"
description = "Automated FHIR R4 conformance testing from Implementation Guide packages"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
flate2 = "1"
tar = "0.4"
petgraph = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fake = { version = "4", features = ["derive"] }
rand = "0.9"
axum = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
http-body-util = "0.1"
bytes = "1"
cargo-husky = "1"
