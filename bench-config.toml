# FHIR Autotest Benchmark — Configuration
#
# This file configures the performance/load testing crate (fhir-autotest-bench).
# It layers on top of the project's config.toml, which provides the server URL,
# IG package path, and data generation settings.
#
# Usage: cargo run -p fhir-autotest-bench -- --config bench-config.toml

# Path to the project's config.toml (default: ./config.toml)
# config_path = "./config.toml"

# Number of concurrent virtual users (connections)
# concurrency = 10

# Duration of the benchmark in seconds (0 = run all tests once)
# duration_secs = 30

# Ramp-up time in seconds — gradually increase concurrency over this period
# ramp_up_secs = 5

# Timeout per individual request in seconds
# request_timeout_secs = 30

# Path to an existing test_plan.json. If absent, one is generated from the IG package.
# test_plan = "./output/test_plan.json"

# Output directory for benchmark reports (default: ./bench-results)
# output = "./bench-results"

# Skip the data-ensure step (assume data already exists on the server)
# skip_data_ensure = false

# Skip cleanup after the benchmark
# skip_cleanup = false

# Filter test groups by resource type (empty = all groups)
# filter_groups = ["Patient", "Observation"]

# Number of warm-up requests before recording measurements
# warmup_requests = 10
