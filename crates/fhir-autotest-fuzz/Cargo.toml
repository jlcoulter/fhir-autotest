[package]
name = "fhir-autotest-fuzz"
version = "0.1.0"
edition = "2024"
description = "FHIR REST API fuzzer — context-aware mutation testing for FHIR servers"
license = "Apache-2.0"

[dependencies]
fhir-autotest = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tempfile = "3"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
