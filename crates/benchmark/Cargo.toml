[package]
name = "fhir-autotest-bench"
version = "0.1.0"
edition = "2024"
description = "Performance and load testing for FHIR servers using fhir-autotest test plans"
license = "Apache-2.0"

[dependencies]
fhir-autotest = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
toml = "0.8"
indicatif = "0.17"
hdrhistogram = "7"
