# FHIR IG Test Generator — Configuration
#
# The config file is the single source of truth. Once defined, running the tool
# is as simple as: fhir-autotest
#
# CLI flags (--package, --output, --dry-run, --generate, --mock)
# override the corresponding config fields when provided.

# ── Inputs / Outputs ────────────────────────────────────────────────────────

# Path to the IG package (.tgz). Required unless passed via --package flag.
package = "./package/package.tgz"

# Output directory for generated test plan and resources (default: ./output).
# Resources are written to {output}/resources/{ProfileName}.json, one per
# profile in the IG, each stamped with meta.profile for the canonical URL.
output = "./output"

# Test results are written to {output}/results/ after every run:
#   - summary.json: overall pass/fail totals and per-group breakdowns
#   - {GroupName}.json: full test results for each group (Patient, Observation, _conformance, etc.)

# Run in dry-run mode: print all test URLs without executing them.
# Uncomment to enable, or pass --dry-run on the CLI.
# dry_run = true

# ── Mock Server ─────────────────────────────────────────────────────────────
#
# Use a built-in mock FHIR server instead of connecting to a real one.
# Starts an in-process server that handles CRUD operations and basic search
# filtering. Useful for development, CI, and quick smoke tests.
#
# Can also be enabled via --mock on the CLI (CLI flag takes precedence).
# When mock is true, the [server] and [repository] sections are ignored —
# all requests go to the mock server.
#
# mock = true
# mock_port = 0

# ── Server ───────────────────────────────────────────────────────────────────

# The base URL of the public-facing FHIR server.
# Used for test queries (GET/search). In development, also used for writes
# when no repository is configured.
[server]
base_url = "http://localhost:8888/api/v1/fhir"

# Optional HTTP headers sent with every request (e.g. auth tokens).
# Uncomment and set as needed.
# [server.headers]
# Authorization = "Bearer your-token-here"
# X-API-Key = "your-api-key"

# ── Repository (optional) ────────────────────────────────────────────────────
#
# Internal FHIR repository for creating and deleting test setup resources.
# When configured, resource upload/delete go here instead of the public server.
# This is useful when the public API only allows search/read.
# Uncomment and configure as needed.
#
# ⚠ SECURITY: Username and password are stored in plaintext in this file.
#   To avoid committing credentials to version control:
#   1. Use ${ENV_VAR} syntax: username = "${FHIR_REPO_USER}"
#   2. Or use credential_file to point to a separate file with restricted
#      permissions (e.g. chmod 600).
#
[repository]
base_url = "http://localhost:8080/fhir"
# Use environment variables instead of plaintext:
# username = "${FHIR_REPO_USER}"
# password = "${FHIR_REPO_PASS}"
username = "admin"
password = "admin123"
upload_method = "PUT"
# Concurrency for upload/delete operations. 1 = sequential, safe for most
# repositories. Increase if the repository can handle parallel requests.
concurrency = 100

# ── Overrides ────────────────────────────────────────────────────────────────

[overrides]

# Optional path to a responder CapabilityStatement JSON file.
# When set, this file replaces the CapabilityStatement selected from the IG
# package for test planning/conformance checks.
# capability_statement_file = "./package/metadata.json"

# Manual creation order. If set, this replaces the auto-resolved dependency
# order. Resource types not listed here are appended in their original order.
# Uncomment to override.
# creation_order = ["Patient", "Practitioner", "Organization", "Location", "HealthcareService", "Endpoint", "PractitionerRole", "Provenance"]

# Directory containing fixture JSON files. When a fixture_map entry exists,
# the fixture file is used instead of generating a resource from the profile.
# Uncomment to enable.
# fixtures_dir = "./fixtures"

# Map of resource type → fixture filename (relative to fixtures_dir).
# Only used when fixtures_dir is set.
# [overrides.fixture_map]
# Patient = "my-custom-patient.json"

# ── Data Generation (optional) ──────────────────────────────────────────────
#
# Generate bulk test data in NDJSON format, upload it to the repository before
# tests run, and delete it afterward. Each resource type gets its own file:
#   {output}/data/{ResourceType}.ndjson
#
# Resources reference each other: PractitionerRole points to Practitioner and
# Organization, HealthcareService references Location and Organization, etc.
# Locations include realistic US coordinates for near/distance searches.
#
# This is the recommended way to create realistic load-test volumes. When
# data_generation.counts is configured, the single-resource setup phase is
# skipped — only the bulk data is uploaded.
#
[data_generation]

# When true, generate NDJSON files but skip uploading to the repository
# and skip bulk deletion after tests. The files remain in {output}/data/
# for manual upload. Useful when you want to control the upload process
# yourself or send data to a separate system.
# generate_only = true

# Number of resources to generate per type.
# Comment out or remove types you don't need.
counts.Organization = 200
counts.Practitioner = 100
counts.PractitionerRole = 300
counts.Location = 200
counts.HealthcareService = 100
counts.Endpoint = 500
counts.Provenance = 100

# ── Fuzzer (optional) ──────────────────────────────────────────────────────
#
# Settings for fhir-autotest-fuzz. All fields have CLI flag equivalents
# that override these values.
#
# [fuzz]
# Number of fuzz iterations per resource type per mutator (default: 100).
# iterations = 100
#
# Comma-separated mutation categories: boundary, type_mismatch, cardinality,
# encoding, search_param, or "all" (default: all).
# mutations = "all"
#
# Seed for deterministic fuzzing (0 = random, default: 0).
# seed = 0
#
# Delay in milliseconds between requests (default: 0 = no delay).
# delay_ms = 200
#
# Concurrency level (default: 4).
# concurrency = 4
