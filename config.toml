# ── Repository (optional) ────────────────────────────────────────────────────
#
# Internal FHIR repository for creating and deleting test setup resources.
# When configured, resource upload/delete go here instead of the public server.
# This is useful when the public API only allows search/read.
# Uncomment and configure as needed.
#
# ⚠ SECURITY: Username and password are stored in plaintext in this file.
#   To avoid committing credentials to version control:
#   1. Use ${ENV_VAR} syntax: username = "${FHIR_REPO_USER}"
#   2. Or use credential_file to point to a separate file with restricted
#      permissions (e.g. chmod 600).
#
[repository]
base_url = "http://localhost:8080/fhir"
# Use environment variables instead of plaintext:
# username = "${FHIR_REPO_USER}"
# password = "${FHIR_REPO_PASS}"
username = "admin"
password = "admin123"
upload_method = "PUT"
# Concurrency for upload/delete operations. 1 = sequential, safe for most
# repositories. Increase if the repository can handle parallel requests.
concurrency = 100

# ── Overrides ────────────────────────────────────────────────────────────────

[overrides]

# Optional path to a responder CapabilityStatement JSON file.
# When set, this file replaces the CapabilityStatement selected from the IG
# package for test planning/conformance checks.
# capability_statement_file = "./package/metadata.json"

# Fetch the responder CapabilityStatement from the live server's /metadata
# endpoint instead of the one bundled in the IG package. Uses the [server]
# base_url, headers, and TLS settings. Ignored when
# capability_statement_file is set (the file takes precedence).
capability_statement_from_server = true

# Manual creation order. If set, this replaces the auto-resolved dependency
# order. Resource types not listed here are appended in their original order.
# Uncomment to override.
# creation_order = ["Patient", "Practitioner", "Organization", "Location", "HealthcareService", "Endpoint", "PractitionerRole", "Provenance"]

# Directory containing fixture JSON files. When a fixture_map entry exists,
# the fixture file is used instead of generating a resource from the profile.
# Uncomment to enable.
# fixtures_dir = "./fixtures"

# Map of resource type → fixture filename (relative to fixtures_dir).
# Only used when fixtures_dir is set.
# [overrides.fixture_map]
# Patient = "my-custom-patient.json"

# Maximum number of search parameters combined in a single combinatorial search
# test. All combination sizes from 2 up to this value are generated per resource
# (e.g. 3 produces both pairs and triples). Default: 2 (pairs only).
#
# Each combined parameter's value is drawn from the generated setup resources,
# so the data required for these combinations is created automatically. Higher
# values grow combinatorially — raise deliberately. Values below 2 disable
# combinatorial search tests.
# max_search_combo_params = 2

# ── Data Generation (optional) ──────────────────────────────────────────────
#
# Generate bulk test data in NDJSON format, upload it to the repository before
# tests run, and delete it afterward. Each resource type gets its own file:
#   {output}/data/{ResourceType}.ndjson
#
# Resources reference each other: PractitionerRole points to Practitioner and
# Organization, HealthcareService references Location and Organization, etc.
# Locations include realistic US coordinates for near/distance searches.
#
# This is the recommended way to create realistic load-test volumes. When
# data_generation.counts is configured, the single-resource setup phase is
# skipped — only the bulk data is uploaded.
#
[data_generation]

# When true, generate NDJSON files but skip uploading to the repository
# and skip bulk deletion after tests. The files remain in {output}/data/
# for manual upload. Useful when you want to control the upload process
# yourself or send data to a separate system.
# generate_only = true

# Number of resources to generate per type.
# Comment out or remove types you don't need.
counts.Organization = 200
counts.Practitioner = 100
counts.PractitionerRole = 300
counts.Location = 200
counts.HealthcareService = 100
counts.Endpoint = 500
counts.Provenance = 100

# ── Benchmark (optional) ─────────────────────────────────────────────────────
#
# Settings for fhir-autotest-bench (performance/load testing).
# All fields have defaults — uncomment to override.
#
[bench]
mode = "soak"              # "steady", "max_throughput", or "soak"
concurrency = 50
# duration_secs = 30
# ramp_up_secs = 5
# request_timeout_secs = 30
# output = "./bench-results"
# skip_data_ensure = false
# skip_cleanup = false
# filter_groups = []
# warmup_requests = 10
# test_plan = "./output/test_plan.json"
#
# # Max-throughput mode settings
# min_concurrency = 1
# max_concurrency = 500
# step_size = 10
# stabilization_secs = 10
# max_error_rate = 0.05
# max_latency_p95_ms = 200
#
# # Soak mode settings
soak_hours = 1
# ── Fuzzer (optional) ──────────────────────────────────────────────────────
#
# Settings for fhir-autotest-fuzz. All fields have CLI flag equivalents
# that override these values.
#
# [fuzz]
# Number of fuzz iterations per resource type per mutator (default: 100).
# iterations = 100
#
# Comma-separated mutation categories: boundary, type_mismatch, cardinality,
# encoding, search_param, or "all" (default: all).
# mutations = "all"
#
# Seed for deterministic fuzzing (0 = random, default: 0).
# seed = 0
#
# Delay in milliseconds between requests (default: 0 = no delay).
# delay_ms = 200
#
# Concurrency level (default: 4).
# concurrency = 4

# ── Custom Tests (optional) ────────────────────────────────────────────────
#
# Define your own tests alongside the auto-generated ones. The tool generates
# resources from IG profiles, creates them on the server, substitutes real IDs
# and field values into URLs, runs the tests, and cleans up.
#
# Three sections:
#   overrides  — override values used in auto-generated tests
#   skip       — skip auto-generated tests by name (substring match)
#   test       — simple single-request tests
#   sequence   — multi-step tests with state passing between steps
#
# URL templates:
#   {base_url}              — the server's base URL
#   {Patient.id}            — server-assigned ID of a created Patient resource
#   {Patient.name.family}   — field value extracted from the generated resource
#   {steps.prac.id}         — ID from a sequence step saved as "prac"
#   {steps.prac.name.family} — field from a sequence step response
#
# Example:
#
# [custom_tests]
#
# # Override values used in auto-generated tests
# overrides = [
#   { param = "identifier", value = "http://example.com/mrn|KNOWN-001" },
# ]
#
# # Skip auto-generated tests that don't apply
# skip = ["SearchModifier:name:contains"]
#
# # Simple single-request tests
# [[custom_tests.test]]
# name = "Read a Patient"
# method = "GET"
# url = "/Patient/{Patient.id}"
#
# [[custom_tests.test]]
# name = "Search by name"
# method = "GET"
# url = "/Patient?name={Patient.name.family}"
# assert = { expected_status = 200, bundle_type = "searchset" }
#
# [[custom_tests.test]]
# name = "Create a Patient"
# method = "POST"
# url = "/Patient"
# body = "auto"
# assert = { expected_status = 201 }
#
# [[custom_tests.test]]
# name = "Delete a Patient"
# method = "DELETE"
# url = "/Patient/{Patient.id}"
# assert = { expected_status = 204 }
#
# # Multi-step sequence: create → update → verify
# [[custom_tests.sequence]]
# name = "Propagation test"
#
#   [[custom_tests.sequence.step]]
#   action = "create"
#   resource = "Practitioner"
#   body_overrides = { name = [{ family = "Test" }] }
#   save_as = "prac"
#
#   [[custom_tests.sequence.step]]
#   action = "read"
#   resource = "Practitioner"
#   id = "{steps.prac.id}"
#   assert = { expected_status = 200 }
#
# Available assert fields:
#   expected_status      — HTTP status code (default: 200)
#   bundle_type          — "searchset", "history", "batch", "transaction"
#   min_entries          — minimum Bundle entries
#   max_entries          — maximum Bundle entries
#   bundle_total_present — true/false
#   summary_mode         — "count", "text", "data", "true"
#   outcome_severity     — "error", "warning", "information"
#   accept_statuses      — alternative acceptable status codes
#   field_values         — map of field path → expected value
#   absent_fields        — fields that must be absent
#   required_fields      — fields that must be present
#   sort_by              — { field = "birthdate", direction = "asc" }
#   resource_types       — expected resource types in Bundle
#   response_contains_key — top-level key that must exist
#   response_resource_types — allowed resourceType values
