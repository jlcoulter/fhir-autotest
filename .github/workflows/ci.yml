name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (all workspace members)
        run: cargo test --all

      - name: Test bench crate explicitly
        run: cargo test -p fhir-autotest-bench

      - name: Test fuzz crate explicitly
        run: cargo test -p fhir-autotest-fuzz

      - name: Fuzz smoke test (10 iterations against mock server)
        run: cargo run -p fhir-autotest-fuzz -- --mock --iterations 10

      - name: Build release
        run: cargo build --release